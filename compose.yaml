services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eticaret-laravel
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: eticaret
      DB_USERNAME: eticaret_user
      DB_PASSWORD: eticaret_password
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: eticaret-mysql
    environment:
      MYSQL_DATABASE: eticaret
      MYSQL_USER: eticaret_user
      MYSQL_PASSWORD: eticaret_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
